<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sample Issue Tracker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="hero">
        <h1>Sample Issue Tracker</h1>
        <p>Track issues locally and attach Octopus task IDs for approval workflows.</p>
      </section>

      <section class="panel">
        <h2>Create issue</h2>
        <form id="issue-form" class="issue-form">
          <label>
            Title
            <input id="title" name="title" type="text" maxlength="80" required />
          </label>

          <label>
            Description
            <textarea id="description" name="description" rows="4" maxlength="500"></textarea>
          </label>

          <label>
            Octopus task ID
            <input id="octopusTaskId" name="octopusTaskId" type="text" placeholder="Tasks-1234" />
          </label>

          <button type="submit">Add issue</button>
        </form>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2>Issues</h2>
          <button id="reset-sample" type="button" class="secondary">Load sample issue</button>
        </div>
        <div id="issue-list" class="issue-list" aria-live="polite"></div>
      </section>
    </main>

    <template id="issue-template">
      <article class="issue-card">
        <div class="issue-card__header">
          <div>
            <h3 class="issue-card__title"></h3>
            <p class="issue-card__meta"></p>
          </div>
          <button type="button" class="danger issue-delete">Delete</button>
        </div>
        <p class="issue-card__description"></p>
        <div class="issue-card__footer">
          <label>
            Status
            <select class="issue-status">
              <option value="open">Open</option>
              <option value="in-review">In review</option>
              <option value="approved">Approved</option>
              <option value="closed">Closed</option>
            </select>
          </label>
          <p class="issue-card__task"></p>
        </div>
      </article>
    </template>

    <script src="app.js"></script>
  </body>
</html>
