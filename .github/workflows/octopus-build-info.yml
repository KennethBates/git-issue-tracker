name: Push build information to Octopus

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  push-build-information:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      OCTOPUS_URL: ${{ secrets.OCTOPUS_URL }}
      OCTOPUS_API_KEY: ${{ secrets.OCTOPUS_API_KEY }}
      OCTOPUS_SPACE: ${{ vars.OCTOPUS_SPACE }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute sample package version
        id: version
        shell: bash
        run: echo "value=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Check Octopus configuration
        id: octopus-config
        shell: bash
        run: |
          if [[ -n "$OCTOPUS_URL" && -n "$OCTOPUS_API_KEY" && -n "$OCTOPUS_SPACE" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "configured=false" >> "$GITHUB_OUTPUT"
          echo "::warning::Skipping Octopus build information push because OCTOPUS_URL, OCTOPUS_API_KEY, and/or OCTOPUS_SPACE is not configured."

      - name: Push build information to Octopus Deploy
        if: ${{ steps.octopus-config.outputs.configured == 'true' }}
        uses: OctopusDeploy/push-build-information-action@v4
        with:
          server: ${{ env.OCTOPUS_URL }}
          api_key: ${{ env.OCTOPUS_API_KEY }}
          space: ${{ env.OCTOPUS_SPACE }}
          packages: |
            git-issue-tracker
          version: ${{ steps.version.outputs.value }}
          overwrite_mode: OverwriteExisting
